
name: Проверка сервиса заявок

on:
  push:
    branches:
      - main
      - 'hotfix/**'
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - 'hotfix/**'
  workflow_dispatch:

jobs:
  validate:
    name: Проверка кода
    runs-on: ubuntu-latest

    steps:
      - name: Получение проекта
        uses: actions/checkout@v4

      - name: Проверка наличия DEPLOY_TOKEN
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "Секрет DEPLOY_TOKEN не настроен"
            exit 1
          fi
          echo "Секрет DEPLOY_TOKEN настроен"

      - name: Проверка версии Python
        run: docker run --rm python:3.12.7-slim python --version

      - name: Проверка синтаксиса Python
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            python:3.12.7-slim \
            python -m compileall -q .

      - name: Проверка табуляции
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          files = [
              p for p in Path(".").rglob("*.py")
              if not any(x in p.parts for x in [".git", ".venv", "__pycache__"])
          ]

          errors = []

          for file in files:
              for number, line in enumerate(file.read_text(encoding="utf-8").splitlines(), 1):
                  indentation = line[:len(line) - len(line.lstrip(" \t"))]
                  if "\t" in indentation:
                      errors.append(f"{file}:{number}")

          if errors:
              print("Обнаружена табуляция:")
              print("\n".join(errors))
              sys.exit(1)

          print("Проверка табуляции пройдена")
          PY

  unit_tests:
    name: Автоматические тесты
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Получение проекта
        uses: actions/checkout@v4

      - name: Запуск тестов
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            python:3.12.7-slim \
            python -m unittest discover -s tests -v

  package:
    name: Подготовка пакета
    runs-on: ubuntu-latest
    needs: unit_tests
    if: |
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/') ||
      startsWith(github.ref, 'refs/heads/hotfix/'))) ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main')

    steps:
      - name: Получение проекта
        uses: actions/checkout@v4

      - name: Формирование пакета
        run: |
          mkdir -p dist
          cp tickets.py README.md Dockerfile tickets.csv.example dist/
          echo "CI_COMMIT_SHA=$GITHUB_SHA" > dist/manifest.txt
          echo "CI_PIPELINE_ID=$GITHUB_RUN_ID" >> dist/manifest.txt
          echo "APP_PORT=8103" >> dist/manifest.txt
          echo "FILES:" >> dist/manifest.txt
          printf '%s\n' tickets.py README.md Dockerfile tickets.csv.example >> dist/manifest.txt

      - name: Публикация артефакта
        uses: actions/upload-artifact@v4
        with:
          name: tickets-service-package
          path: dist/
          retention-days: 7

  